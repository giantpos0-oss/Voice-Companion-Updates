name: Deploy BlindScan AI service

# The Cloudflare Worker that answers "Ask a question" in BlindScan, Will's Android scanner
# (github.com/giantpos0-oss/BlindScan). It lives here because it uses Voice Companion's
# Cloudflare account and OpenAI key (Will, November 23, 2026). It never touches Voice
# Companion itself. See tools/blindscan-ai/README.md.
on:
  push:
    branches: [main, 'claude/blindscan-ai']
    paths: ['tools/blindscan-ai/**', '.github/workflows/blindscan-ai.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the service
        run: node tools/blindscan-ai/test-worker.mjs
      - name: Check the secrets are there
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$OPENAI_API_KEY" ] && missing="$missing OPENAI_API_KEY"
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$R2_ACCOUNT_ID" ] && missing="$missing R2_ACCOUNT_ID"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing."; exit 1; fi
          # The account id secret may hold the R2 S3 address; take the 32-character id from it.
          id=$(printf '%s' "$R2_ACCOUNT_ID" | grep -oE '[0-9a-f]{32}' | head -1)
          if [ -z "$id" ]; then echo "::error::R2_ACCOUNT_ID does not contain a Cloudflare account id."; exit 1; fi
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"
      - name: Deploy the Worker and its OpenAI key
        working-directory: tools/blindscan-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # A new Worker's first deploy can upload it and then fail to find it (code 10007,
          # November 16, 2026, Voice Companion). Print wrangler's log on failure, then retry once.
          if ! npx --yes wrangler@4 deploy; then
            cat ~/.config/.wrangler/logs/*.log 2>/dev/null | grep -v -i authorization | tail -60
            echo "First deploy failed; trying once more in 15 seconds."
            sleep 15
            npx --yes wrangler@4 deploy || { cat ~/.config/.wrangler/logs/*.log 2>/dev/null | grep -v -i authorization | tail -60; echo "::error::wrangler deploy failed twice; its log above says why."; exit 1; }
          fi
          printf '%s' "$OPENAI_API_KEY" | npx --yes wrangler@4 secret put OPENAI_API_KEY || { echo "::error::Could not store the OpenAI key in the Worker."; exit 1; }
      - name: Check the service answers
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            if curl -fsS https://blindscan-ai.voicecompanionapp.com/v1/health; then echo; echo "The BlindScan AI service is live."; exit 0; fi
            sleep 10
          done
          echo "::error::https://blindscan-ai.voicecompanionapp.com/v1/health did not answer. Check the custom domain in Cloudflare."; exit 1
      - name: Ask real questions the way the phone does (checks Cloudflare lets the app through)
        run: |
          id=$(printf 'c%.0s' $(seq 1 32))
          doc='{"document":"City Water Utility\n\nAccount 4417-22\n\nAmount due: $84.17\n\nPlease pay by December 15, 2026. Late fee: $5.00.","question":"QUESTION"}'
          ask() {
            # $1: User-Agent, $2: question. Cloudflare can turn some app names away (error 1010) before
            # the Worker sees them, as it did to Voice Companion; ask as BlindScan names itself, and as
            # Android names an app that doesn't, so a block shows up here, not on someone's phone.
            curl -sS -m 120 -X POST https://blindscan-ai.voicecompanionapp.com/v1/ask \
              -H 'content-type: application/json' -H "X-BlindScan-Install: $id" -H 'X-BlindScan-Version: deploy-check' \
              -A "$1" -d "${doc/QUESTION/$2}"
          }
          fail=0
          for ua in 'BlindScan/deploy-check (Android)' 'Dalvik/2.1.0 (Linux; U; Android 17; Pixel 11 Pro XL Build/CP1A)'; do
            reply=$(ask "$ua" 'How much do I owe and when is it due?')
            echo "[$ua] $reply"
            echo "$reply" | grep -q '"ok":true' || { echo "::error::Blocked or failed for User-Agent $ua: $(echo "$reply" | head -c 300)"; fail=1; }
          done
          for q in 'What does a late fee mean?|RELATED' 'Who won the World Series in 1990?|UNRELATED' 'What is my account number?|DOCUMENT'; do
            reply=$(ask 'BlindScan/deploy-check (Android)' "${q%%|*}")
            echo "[${q%%|*}] $reply"
            echo "$reply" | grep -q "SOURCE: ${q##*|}" || { echo "::error::Expected SOURCE: ${q##*|} for '${q%%|*}': $(echo "$reply" | head -c 300)"; fail=1; }
          done
          echo "::notice title=Live answers::$(echo "$reply" | head -c 300)"
          exit $fail
